<!-- options.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Extension Settings</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tweet Moderator Settings</h1>
        <form id="settings-form">
            <label for="anthropicApiKey">Anthropic API key:</label><br>
            <input type="password" id="anthropicApiKey" name="anthropicApiKey" style="width: 100%" placeholder="sk-ant-..."><br><br>

            <label for="tweetPrefix">System Prompt:</label><br>
            <textarea style="width:100%" rows="10" type="text" id="tweetPrefix" name="tweetPrefix"></textarea><br><br>

            <button type="submit">Save</button>
        </form>

        <hr style="margin: 30px 0;">

        <h2>Cache Management</h2>
        <p>The extension caches moderation results to save API calls. Clear the cache if you've changed your system prompt and want to re-evaluate previously checked tweets.</p>
        <button id="clear-cache-btn" type="button">Clear Tweet Cache</button>
        <p id="cache-status" style="color: #666; font-size: 14px; margin-top: 10px;"></p>
    </div>
    <script src="options.js"></script>
</body>
</html>
